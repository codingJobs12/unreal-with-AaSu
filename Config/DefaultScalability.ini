; SOTM production scalability overrides.
; Keep Epic at the authored visual density while bounding texture-pool memory
; at every tier. The previous global 5000 MB pool prevented Unreal's
; TextureQuality groups from scaling on lower-memory systems.

[TextureQuality@0]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=512

[TextureQuality@1]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=768

[TextureQuality@2]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1200

[TextureQuality@3]
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.PoolSize=2000

[TextureQuality@Cine]
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.PoolSize=3000

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.4

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.6

[ViewDistanceQuality@2]
r.ViewDistanceScale=0.8

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0

[FoliageQuality@0]
foliage.DensityScale=0.0
grass.DensityScale=0.0

[FoliageQuality@1]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[FoliageQuality@2]
foliage.DensityScale=0.8
grass.DensityScale=0.8

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0
